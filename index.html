<style>
  :root{--bg:#0e100b;--card:#171a12;--line:#2c3123;--text:#eef1e8;--muted:#a3ab97;--accent:#7ccf5f;--ink:#0e100b;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;
    padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .lock{width:100%;max-width:360px;text-align:center}
  .lock img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  h1{font:700 26px Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
  p{margin:0 0 22px;color:var(--muted);font-size:14px}
  input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:16px inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:var(--ink);font:700 16px Inter,system-ui,sans-serif;cursor:pointer}
  #err{min-height:22px;margin-top:10px;font-size:14px;color:#f0a060}
  .loading .form{display:none}
</style>

  var KEY="fitnes-plan-pw";
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  async function open(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.d));
    return new TextDecoder().decode(buf);
  }
  function show(html){document.open();document.write(html);document.close()}
  function ask(msg){document.body.classList.remove("loading");document.getElementById("sub").textContent="Vpiši geslo. Telefon si ga zapomni.";document.getElementById("err").textContent=msg||"";document.getElementById("pw").focus()}
  // Always try the newest version first (phones keep old copies of the page in cache).
  function fresh(){return new Promise(function(res){var done=false,t=setTimeout(function(){done=true;res()},3000);
    fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(h){
      var m=h.match(/var P=(\{s:"[^"]+",i:"[^"]+",d:"[^"]+",n:\d+\})/);if(m&&!done){try{P=(new Function("return "+m[1]))()}catch(e){}}
      clearTimeout(t);if(!done){done=true;res()}},function(){clearTimeout(t);if(!done){done=true;res()}})})}
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  fresh().then(function(){
    if(saved){open(saved).then(show,function(){try{localStorage.removeItem(KEY)}catch(e){};ask()})}else{ask()}
  });
  document.getElementById("f").addEventListener("submit",function(e){
    e.preventDefault();var pw=document.getElementById("pw").value.trim();if(!pw)return;
    document.getElementById("err").textContent="Odklepam …";
    open(pw).then(function(html){try{localStorage.setItem(KEY,pw)}catch(e){};show(html)},function(){document.getElementById("err").textContent="Napačno geslo, poskusi znova."});
  });
})();
