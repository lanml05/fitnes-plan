<style>
  :root{--bg:#0e100b;--card:#171a12;--line:#2c3123;--text:#eef1e8;--muted:#a3ab97;--accent:#7ccf5f;--ink:#0e100b;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;
    padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .lock{width:100%;max-width:360px;text-align:center}
  .lock img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  h1{font:700 26px Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
  p{margin:0 0 22px;color:var(--muted);font-size:14px}
  input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:16px inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:var(--ink);font:700 16px Inter,system-ui,sans-serif;cursor:pointer}
  #err{min-height:22px;margin-top:10px;font-size:14px;color:#f0a060}
  .loading .form{display:none}
</style>

  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  async function open(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

  }
